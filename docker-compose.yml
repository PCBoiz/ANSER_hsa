# ════════════════════════════════════════════════════════════════════════════
#  ANSER-HSA — triển khai trên một máy ảo bất kỳ
#
#  Hai dịch vụ: ứng dụng, và Caddy đứng trước lo HTTPS. Không có database và
#  không có kho file ở đây — database nằm ở Neon, file nằm ở R2. Nghĩa là MÁY
#  ẢO NÀY KHÔNG GIỮ DỮ LIỆU GÌ: mất máy là dựng lại, không phải mất dữ liệu.
#
#  Xem TRIEN_KHAI.md để biết từng bước.
# ════════════════════════════════════════════════════════════════════════════

services:
  app:
    build:
      context: ./web
    restart: unless-stopped
    # Compose tự đọc file `.env` cạnh đây và nạp nguyên văn — không qua shell,
    # nên dấu `&` trong chuỗi kết nối Postgres không bị hiểu nhầm. Đừng chuyển
    # sang `source .env` trong một script: chỗ đó đã cắn một lần rồi.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Cố ý KHÔNG `ports:`. Ứng dụng chỉ nói chuyện với Caddy qua mạng nội bộ của
    # compose; mở thẳng 3000 ra ngoài là mở một cửa HTTP không mã hoá đi vòng
    # qua HTTPS.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Đặt trong .env. Ví dụ: anserhsa.duckdns.org
      # Muốn thử nhanh bằng địa chỉ IP trần thì đặt TEN_MIEN=:80 — chạy HTTP
      # không mã hoá, chỉ dùng để kiểm lúc dựng, KHÔNG đưa cho khách.
      TEN_MIEN: ${TEN_MIEN:?chưa đặt TEN_MIEN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứng chỉ Let's Encrypt nằm trong /data. Giữ volume này, nếu không thì
      # mỗi lần dựng lại container là xin chứng chỉ mới — và Let's Encrypt có
      # hạn mức, xin quá tay là bị khoá vài ngày.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
